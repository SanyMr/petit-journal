name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Contrôler les langues
        run: python3 tools/i18n_android.py && python3 tools/i18n_check.py

      - name: Installer les dépendances
        run: npm ci

      - name: Copier le journal dans le projet Android
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../mon-petit-journal.apk

      - name: Garder l'APK dans les fichiers de la compilation
        uses: actions/upload-artifact@v4
        with:
          name: mon-petit-journal-apk
          path: mon-petit-journal.apk

      - name: Publier une version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mon petit journal v1.0.${{ github.run_number }}
          body: |
            Télécharge **mon-petit-journal.apk** ci-dessous et ouvre-le sur ton téléphone Android pour l'installer.
          files: mon-petit-journal.apk
